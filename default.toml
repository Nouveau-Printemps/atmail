# location of the main database
db = "/var/lib/atmail/data.db"
# directory containing the mails
directory = "/var/lib/atmail/data"
# folder containing domains' config file
domains_folder = "/etc/atmail/domains.d/"
filters_folder = "/etc/atmail/filters.d/"

# Address of the rspamd server
# rspamd_address = "localhost:11332"
# folder containing email for rspamd's learning
# learn_folder = "/var/lib/atmail/learn"

# domain broadcasted
main_domain = "mail.example.org"

[password]
# default algorithm to use when hashing passwords (can be argon2id, scrypt or bcrypt)
default = "argon2id"

[password.argon2id]
# memory used in MiB
m = 16
# number of iterations
t = 5
# number of parallel threads
p = 2

[password.scrypt]
# 2^N number of iterations
N = 16
# number of parallel threads
p = 2
# block size
r = 8

[password.bcrypt]
cost = 12

[smtp]
# address to listen to (tcp or unix socket)
listen = ":2525"
# group of unix socket (can be a name or a gid)
# socket_group = "mail"
# permission of the socket
# socket_permission = 0o660
# use PROXY V2 Protocol by HAProxy
use_proxy_v2 = false
# allow_insecure_auth = false
# max email size in KiB
max_email_size = 16416
# number of concurrent thread to relay email outside
concurrent_sender = 3

[imap]
listen = ":2993"
use_proxy_v2 = false

[domains."example.org"]
# if you wanna enable support of plus addressing like 'foo+bar@example.org'
plus_subaddressing = true
# if you wanna create an IMAP folder for each subaddress, like 'INBOX/bar' for 'foo+bar@example.org'
create_folder_subaddressing = false

[domains."example.org".admin]
# admin account (used to redirect postmaster@example.org and other security-related mailboxes to the right user)
user = "admin"
# sets the IMAP folder for this account (empty for INBOX)
# folder = "security"
# if you wanna encrypt with PGP
# pgp_pub_key = ""
# pgp_pub_key_file = ""

# If you wanna use den for the auth
# [domains."example.org".den]
# address = "/run/dend.sock"

# If you wanna allow only specific users, maps them to their password (hashed with bcrypt)
# [domains."example.org".static.users]
# foo.password = "$2y$10$wWJy64n5j4pU2CscdWRq.er5Z2.V31U5Ntz5uTopLy1fMX87GQEDG"
# bar.password = "$2y$10$fZ1tRpz2mfdRfaaTbx723.Gch7tY.f7LIBuZz1of/cLwBGvU39ivG"
# You can specify their PGP public key to encrypt their message
# foo.pgp_pub_key = ""
# bar.pgp_pub_key_file = ""
# If you want to only permit local connection regardless of the password
# baz.local_only = true

# If you wanna create system users
# [domains."example.org".static.system_users]
# address to listen to (tcp or unix socket)
# noreply.listen = ":2525"
# group of unix socket (can be a name or a gid)
# noreply.socket_group = "mail"
# permission of the socket
# noreply.socket_permission = 0o660
# noreply.use_proxy_v2 = false

# If you wanna create groups
# [domains."example.org".static.groups]
# users in the group
# somegroupname.members = ["foo@example.org", "bar@example.org"]
# users that can email the group (if unspecified, everyone can)
# somegroupname.authorized_senders = ["foo@example.org"]

# Catch every email into one address
[domains."example.org".catch_all]
user = "me"
password = "bcrypt here"
# pgp_pub_key = ""
# pgp_pub_key_file = ""
